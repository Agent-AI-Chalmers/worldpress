name: Sec Review Bot

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode: full or incremental'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - incremental
      base_sha:
        description: 'Required for manual incremental: base commit SHA (7-40 hex chars)'
        required: false
        default: ''
        type: string
      head_sha:
        description: 'Optional for manual incremental: head commit SHA (defaults to current branch HEAD)'
        required: false
        default: ''
        type: string
      repair_mode:
        description: 'Repair mode for generated fixes'
        required: false
        default: 'test-changes-allowed'
        type: choice
        options:
          - test-changes-allowed
          - no-test-changes
  # Schedule trigger (optional)
  # To enable, uncomment the schedule section below (GitHub Actions uses UTC)
  # schedule:
  #   - cron: '0 3 * * 1'  # Weekly on Monday at 03:00 UTC

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build dispatch payload
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          TARGET_BRANCH: ${{ github.ref_name }}
          INPUT_SCAN_MODE: ${{ github.event.inputs.scan_mode || '' }}
          INPUT_BASE_SHA: ${{ github.event.inputs.base_sha || '' }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha || '' }}
          INPUT_REPAIR_MODE: ${{ github.event.inputs.repair_mode || '' }}
        run: |
          set -euo pipefail
          event_type="manual"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            event_type="scheduled"
          fi
          jq -nc \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg scan_mode "$INPUT_SCAN_MODE" \
            --arg base_sha "$INPUT_BASE_SHA" \
            --arg head_sha "$INPUT_HEAD_SHA" \
            --arg event_type "$event_type" \
            --arg schedule "$EVENT_SCHEDULE" \
            --arg repair_mode "$INPUT_REPAIR_MODE" \
            --arg correlation_id "$GITHUB_RUN_ID" \
            '{
              repoFullName: $repo,
              targetBranch: $target_branch,
              scanMode: $scan_mode,
              baseSha: $base_sha,
              headSha: $head_sha,
              eventType: $event_type,
              schedule: $schedule,
              repairMode: $repair_mode,
              correlationId: $correlation_id
            }' > payload.json

      - name: Sign payload
        id: signature
        env:
          SHARED_SECRET: ${{ secrets.SEC_BOT_SHARED_SECRET }}
        run: |
          # Sign the exact JSON payload so the backend can verify that
          # the dispatch request came from this workflow.
          signature=$(openssl dgst -sha256 -hmac "$SHARED_SECRET" -binary < payload.json | xxd -p -c 256)
          echo "signature=sha256=$signature" >> "$GITHUB_OUTPUT"

      - name: Dispatch repository security review
        env:
          DISPATCH_URL: ${{ secrets.SEC_BOT_DISPATCH_URL }}
          SIGNATURE: ${{ steps.signature.outputs.signature }}
        run: |
          # This calls the bot's repository-review dispatch endpoint,
          # not the GitHub App webhook endpoint.
          curl --fail-with-body \
            -X POST \
            -H "content-type: application/json" \
            -H "x-sec-review-bot-signature-256: $SIGNATURE" \
            --data-binary @payload.json \
            "$DISPATCH_URL"
